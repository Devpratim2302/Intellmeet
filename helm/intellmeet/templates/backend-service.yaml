apiVersion: v1
kind: Service
metadata:
  name: {{ include "intellmeet.fullname" . }}-backend
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.backend.service.port }}"
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http-socket
  selector:
    {{- include "intellmeet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
# DNS alias service so frontend container's internal Nginx proxy resolves http://backend:5001 seamlessly
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http-socket
  selector:
    {{- include "intellmeet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

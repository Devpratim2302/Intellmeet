apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intellmeet.fullname" . }}-config
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  MONGODB_URI: {{ printf "mongodb://%s-mongodb:%d/%s" (include "intellmeet.fullname" .) (int .Values.mongodb.service.port) .Values.mongodb.database | quote }}
  REDIS_URI: {{ printf "redis://%s-redis:%d" (include "intellmeet.fullname" .) (int .Values.redis.service.port) | quote }}
  CLIENT_URL: {{ .Values.config.clientUrl | quote }}
  JWT_ACCESS_EXPIRES_IN: {{ .Values.config.jwtAccessExpiresIn | quote }}
  JWT_REFRESH_EXPIRES_IN: {{ .Values.config.jwtRefreshExpiresIn | quote }}
  TRANSCRIPTION_PROVIDER: {{ .Values.config.transcriptionProvider | quote }}
  AI_PROVIDER: {{ .Values.config.aiProvider | quote }}
  AI_MODEL: {{ .Values.config.aiModel | quote }}
  MAX_AUDIO_UPLOAD_SIZE_MB: {{ .Values.config.maxAudioUploadSizeMb | quote }}

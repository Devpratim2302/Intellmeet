{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "intellmeet.fullname" . }}-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          # API route to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" $ }}-backend
                port:
                  number: {{ $.Values.backend.service.port }}
          # Socket.io & WebSocket signaling route to backend
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" $ }}-backend
                port:
                  number: {{ $.Values.backend.service.port }}
          # Single Page Application & static frontend route
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
{{- end }}

# =========================================================================
# IntellMeet Helm Chart - Production Cloud Environment Values
# Usage:
#   helm upgrade --install intellmeet helm/intellmeet -f helm/intellmeet/values-production.yaml \
#     --set secrets.jwtAccessSecret="<STRONG_CRYPTOGRAPHIC_SECRET_HERE>" \
#     --set secrets.jwtRefreshSecret="<STRONG_CRYPTOGRAPHIC_SECRET_HERE>"
# =========================================================================

global:
  namespace: intellmeet
  environment: production

namespace:
  create: true
  name: intellmeet

config:
  port: 5001
  nodeEnv: production
  clientUrl: "https://meet.intellmeet.com"
  transcriptionProvider: "openai"
  aiProvider: "openai"
  aiModel: "gpt-4o-mini"
  maxAudioUploadSizeMb: 50
  jwtAccessExpiresIn: "15m"
  jwtRefreshExpiresIn: "7d"
  redisEnabled: "true"

secrets:
  # Sensitive secrets MUST be supplied via --set or external Secret store in CI/CD
  jwtAccessSecret: ""
  jwtRefreshSecret: ""
  openaiApiKey: ""
  deepgramApiKey: ""

backend:
  replicaCount: 3
  image:
    repository: intellmeet/backend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5001
    targetPort: 5001
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  terminationGracePeriodSeconds: 30
  probes:
    startup:
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 10
    liveness:
      path: /api/health
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /api/health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 2

frontend:
  replicaCount: 2
  image:
    repository: intellmeet/frontend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    liveness:
      path: /health
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 2

mongodb:
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  persistence:
    storageClass: "gp3" # EKS gp3, GKE standard-rwo, or DO do-block-storage
    size: 20Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 2048Mi

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "intellmeet-backend"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: meet.intellmeet.com
      paths:
        - path: /socket.io
          pathType: Prefix
          service: backend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /metrics
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: intellmeet-tls-cert
      hosts:
        - meet.intellmeet.com
